name: CI

on:
  push:
    branches: [master, 'refonte/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm exec --no -- prettier --check CLAUDE.md .github/workflows/ci.yml
      - run: npm test
      - run: npm run build
