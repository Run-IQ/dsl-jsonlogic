name: CI

on:
  push:
    branches: [master, 'refonte/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      # Like core, use the base's spec branch; phase-2 pushes must replay it too.
      SPEC_REF: ${{ startsWith(github.base_ref, 'refonte/') && github.base_ref || startsWith(github.ref_name, 'refonte/') && github.ref_name || (github.event_name == 'workflow_dispatch' && 'refonte/phase-2' || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      - name: Check that spec has the branch
        if: env.SPEC_REF != ''
        run: |
          if ! git ls-remote --exit-code https://github.com/Run-IQ/spec.git "refs/heads/$SPEC_REF" > /dev/null; then
            echo "::error::Run-IQ/spec has no branch $SPEC_REF. Refusing to test against published spec."
            exit 1
          fi
      - name: Check out spec
        if: env.SPEC_REF != ''
        uses: actions/checkout@v4
        with:
          repository: Run-IQ/spec
          ref: ${{ env.SPEC_REF }}
          path: spec-refonte
      - name: Build spec
        if: env.SPEC_REF != ''
        run: |
          npm ci --prefix spec-refonte
          npm run build --prefix spec-refonte
      - name: Drop the unpublished direct spec from the runner install
        if: env.SPEC_REF != ''
        run: |
          node --input-type=commonjs <<'JS'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete manifest.dependencies['@run-iq/spec'];
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          delete lock.packages[''].dependencies['@run-iq/spec'];
          // Keep locked next.0 for the unchanged old core peer's transitive install.
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          JS
      - run: npm ci
      - name: Link the built spec
        if: env.SPEC_REF != ''
        run: |
          rm -rf node_modules/@run-iq/spec
          ln -s "$PWD/spec-refonte" node_modules/@run-iq/spec
          # Typecheck and build the committed dependency contract after the install substitution.
          git restore --source=HEAD -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm exec --no -- prettier --check CLAUDE.md README.md .github/workflows/ci.yml
      - run: npm test
      - run: npm run build
